name: build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  job-test:
    name: Test
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run lint
        uses: reviewdog/action-golangci-lint@c76cceaaab89abe74e649d2e34c6c9adc26662d2 # v2.10.0
        with:
          fail_level: warning
          go_version_file: go.mod

      - name: Run tests
        run: make ci

      - name: Run octocov
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2

  job-run-test:
    name: Setup test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEBUG: true
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare source-built bootstrap cache
        run: bash scripts/prepare-test-cache.sh
        shell: bash

      - name: Run setup test
        run: |
          go run cmd/gh-setup/main.go --repo k1LoW/colr --version v1.1.1 --force
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run installed CLI
        run: colr -v
        shell: bash

      - name: Run setup as an action
        uses: ./
        with:
          repo: k1LoW/tbls
          version: v1.84.0
          strict: true
          gh-setup-version: source-test

      - name: Check installed cache
        run: |
          tbls version
          binary="$(command -v tbls)"
          cache_root="$(cd "$RUNNER_TOOL_CACHE" && pwd)"
          [[ "$binary" == "$cache_root/"*"/1.84.0/"*"/bin/"* ]]
          root="$(dirname "$(dirname "$binary")")"
          test -f "${root}.complete"
          test -f "${root}/gh-setup.json"
          cp "${root}/gh-setup.json" "${RUNNER_TEMP}/tbls-manifest.json"
          touch -t 202001010000 "$binary"
          touch -r "$binary" "${RUNNER_TEMP}/tbls-install-time"
        shell: bash

      - name: Reuse setup cache without Force
        uses: ./
        with:
          repo: k1LoW/tbls
          version: v1.84.0
          strict: true
          gh-setup-version: source-test

      - name: Check cache reuse
        run: |
          tbls version
          binary="$(command -v tbls)"
          root="$(dirname "$(dirname "$binary")")"
          cmp "${root}/gh-setup.json" "${RUNNER_TEMP}/tbls-manifest.json"
          test ! "$binary" -nt "${RUNNER_TEMP}/tbls-install-time"
          test ! "$binary" -ot "${RUNNER_TEMP}/tbls-install-time"
        shell: bash

      - name: Exercise explicit directory opt-out
        run: |
          mkdir -p "${RUNNER_TEMP}/explicit-bin"
          go run cmd/gh-setup/main.go --repo k1LoW/colr --version v1.1.1 --bin-dir="${RUNNER_TEMP}/explicit-bin"
          test -f "${RUNNER_TEMP}/explicit-bin/colr" || test -f "${RUNNER_TEMP}/explicit-bin/colr.exe"
        shell: bash

  job-on-container-test:
    name: Test on container
    runs-on: ubuntu-latest
    container:
      image: debian:latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEBUG: true
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare source-built bootstrap cache
        run: bash scripts/prepare-test-cache.sh
        shell: bash

      - name: Set up GitHub CLI using asset and binary matches
        uses: ./
        with:
          repo: cli/cli
          bin-match: bin/gh$
          match: tar.gz$
          gh-setup-version: source-test

      - name: Run installed GitHub CLI
        run: gh version
        shell: bash

      - name: Run setup as an action
        uses: ./
        with:
          repo: k1LoW/tbls
          version: v1.84.0
          os: linux
          arch: amd64
          checksum: 83f35a07fd2a00c2aa360a47edca6d261f5208186911977eff39097151fc57d5
          strict: true
          gh-setup-version: source-test

      - name: Reuse verified setup cache
        uses: ./
        with:
          repo: k1LoW/tbls
          version: v1.84.0
          os: linux
          arch: amd64
          checksum: 83f35a07fd2a00c2aa360a47edca6d261f5208186911977eff39097151fc57d5
          strict: true
          gh-setup-version: source-test

      - name: Run installed binary
        run: |
          tbls version
          binary="$(command -v tbls)"
          [[ "$binary" == "$RUNNER_TOOL_CACHE/"*"/1.84.0/x64/bin/"* ]]
          test -f "$(dirname "$(dirname "$binary")").complete"
        shell: bash
